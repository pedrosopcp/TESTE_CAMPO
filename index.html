/* ========================================
   PAINEL INFERIOR======================================= */

#bottom-panel {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 70vh;
    background: rgba(5, 5, 5, 0.95);
    z-index: 9997;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.30);
    font-family: Arial, sans-serif;
    transition: transform 0.35s ease;
}

/* Título do painel */
#bottom-panel-title {
    height: 8px;
    background: #0a4d36;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
}

/* Conteúdo */
#bottom-panel-content {
    height: calc(100% - 40px);
    padding: 15px;
    box-sizing: border-box;
    overflow-y: auto;
    font-size: 10px;
    
}

#bottom-panel-content h3 {
    font-size: 12px;
    margin-top: 0;
    margin-bottom: 10px;
    color: #ffffff;
}

#bottom-panel-content p {
    font-size: 12px;
    line-height: 1.5;
    color: #ffffff;
}

/* Botão abrir/fechar */
#bottom-panel-toggle {
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 55px;
    background: #0a4d36;
    color: #ffffff;

}

#bottom-panel-toggle i {

}

#bottom-panel-toggle::after {
    content: "GRÁFICOS";
    font-size: 10px;

}

/* Painel fechado */
#bottom-panel.closed {

/* símbolo quadrado */

/* símbolo de linha */

    border: 2px solid #000000;

}

/* separador */
.legend-separator {
    border-top: 1px solid #ddd;
    margin: 12px 0;
}

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                var lat = position.coords.latitude;

            function(error) {
                alert('Não foi possível obter sua localização. Verifique se a permissão de localização está habilitada.');
            },
            { enableHighAccuracy: true }
        );
    };
    return div;
};
